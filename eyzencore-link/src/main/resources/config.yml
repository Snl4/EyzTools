api:
  base-url: "https://eyzencore.net"
  token: "CHANGE_ME"
stats:
  push-interval-minutes: 5
  push-on-quit: true
whitelist:
  enabled: false
  kick-message: "Подай заявку на сайті eyzencore.net"
chat:
  enabled: true
  # Local chat radius in blocks. Messages without ! go here.
  local-radius: 50
  local-prefix: "&8[Л]&r "
  # Start message with ! for global chat, e.g. ! hello
  global-prefix: "&6[Г]&r "
custom-mobs:
  # Scoreboard tag or PDC key set by the mob pack/plugin. id must match the site.
  crab: { tag: "eyzencore.crab" }
  penguin: { tag: "eyzencore.penguin" }
  deer: { tag: "eyzencore.deer" }
  monkey: { tag: "eyzencore.monkey" }
  alligator: { tag: "eyzencore.alligator" }
  ostrich: { tag: "eyzencore.ostrich" }
  meerkat: { tag: "eyzencore.meerkat" }
  vulture: { tag: "eyzencore.vulture" }
  moobloom: { tag: "eyzencore.moobloom" }
