[package]
name = "eyz-tools"
version = "1.0.0"
description = "Minecraft Resource Pack Generator"
authors = ["EyzTools"]
edition = "2021"

[lib]
name = "eyz_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "eyz-tools"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
